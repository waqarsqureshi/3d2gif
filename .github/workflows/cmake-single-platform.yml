# This workflow builds the 3d2gif project using the existing Makefiles.
name: CMake on a single platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopencv-dev freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Clone vcglib
      run: git clone --depth=1 https://github.com/cnr-isti-vclab/vcglib.git /tmp/vcglib

    - name: Build OBJ target
      working-directory: ${{github.workspace}}/OBJ
      run: make -f makefile_obj2gif VCGLIB_DIR=/tmp/vcglib

    - name: Build PLY target
      working-directory: ${{github.workspace}}/PLY
      run: make -f makefile_ply2gif VCGLIB_DIR=/tmp/vcglib

